# Attempt to detect any upcoming breaking changes if CI hasn't been run in awhile.
name: Weekly Check

on:
  # Allows manual triggering.
  workflow_dispatch:  
  schedule:
   # Run at midnight on Sundays.
   - cron: "0 0 * * 0" 

jobs:
  # Quick canary of code as well as potential issues with upcoming toolchains.
  check:
    strategy:
      matrix:
        toolchain: [stable, beta, nightly]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy,rustfmt
      - run: just check
  # Sync signet end-to-end against the latest published hintsfile.
  signet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: "Install Bitcoin dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install build-essential cmake pkgconf python3 libevent-dev libboost-dev capnproto libcapnp-dev
      - name: "Build node"
        run: cargo build --release -p node --bin ibd
      - name: "Sync signet"
        timeout-minutes: 30
        working-directory: node
        run: just signet
